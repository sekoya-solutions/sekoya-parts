# Checks run on every pull request, decided in docs/adr/0004-testing-and-ci.md.
# No path filter: a required check must report on every pull request. Since
# issue #91, a documentation-only pull request skips the three heavy jobs
# through their if: condition (a skipped job counts as passed), and gets a
# stand-in "Lighthouse" check, since Vercel does not deploy it. Since issue
# #106, so does a push that changes only .md files compared with the previous
# head, when every check on that head passed.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Documentation only when every file differing between the base and head
  # commits ends in .md (scripts/docs-only.ts), or, on a push, between the
  # previous and new heads, when every check on the previous head passed. Any
  # failure here leaves the outputs empty, and the heavy jobs then run.
  changes:
    name: Change detection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # The previous head's checks and statuses (issue #106).
      checks: read
      statuses: read
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
      docs_only_pull_request: ${{ steps.decide.outputs.docs_only_pull_request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Only a push has a previous head; after a force-push it may be
          # gone, and the fetch below then fails toward running everything.
          BEFORE_SHA: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          if node scripts/docs-only.ts "$BASE_SHA" "$HEAD_SHA"; then
            echo "docs_only_pull_request=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE_SHA" ] &&
            git fetch --quiet --no-tags --depth=1 origin "$BEFORE_SHA" &&
            node scripts/docs-only.ts "$BEFORE_SHA" "$HEAD_SHA" &&
            node scripts/docs-only.ts --checks-passed "$BEFORE_SHA"; then
            echo "docs_only_pull_request=false" >> "$GITHUB_OUTPUT"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only_pull_request=false" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # Vercel skips the build of a documentation-only change (vercel.json), so
  # no deployment starts the Lighthouse workflow, and this job posts the
  # required "Lighthouse" check on the head commit in its place. Its own name
  # differs on purpose: a skipped job named "Lighthouse" would satisfy the
  # required check on every pull request.
  # - A documentation-only pull request: posted at once, since the code is
  #   identical to the base commit's (issue #91).
  # - Any other pull request (issue #106): the job waits for Vercel's status on
  #   the head commit. Only if Vercel skipped the build, because every commit
  #   since the branch's last preview changes only .md files, does it copy that
  #   preview's Lighthouse result. When Vercel builds, the real Lighthouse runs
  #   and this job posts nothing.
  lighthouse-stand-in:
    name: Lighthouse stand-in
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      checks: write
      statuses: read
      deployments: read
    steps:
      - if: needs.changes.outputs.docs_only_pull_request == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs"
          -f name=Lighthouse -f head_sha="$HEAD_SHA"
          -f status=completed -f conclusion=success
          -f "output[title]=Not measured: documentation only"
          -f "output[summary]=Every changed file ends in .md, so the code is the base commit's and Vercel skipped the preview (issue #91)."
      # The head's history, to find the last commit Vercel built.
      - if: needs.changes.outputs.docs_only_pull_request != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 50
          persist-credentials: false
      - if: needs.changes.outputs.docs_only_pull_request != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - if: needs.changes.outputs.docs_only_pull_request != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/docs-only.ts --stand-in "$HEAD_SHA"

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint:md

  # The build prerenders a product page, which reads the catalog (issue #47),
  # so this job loads the small catalog into its own PostgreSQL 18 container
  # first, as the "Generator and tests" job does.
  app-checks:
    name: Lint, types and build
    needs: changes
    # Skipped on a documentation-only pull request or push; runs if detection failed.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: sekoya
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sekoya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sekoya -d sekoya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # No usage data is sent from CI builds.
      NEXT_TELEMETRY_DISABLED: "1"
      # A throwaway database that only exists for this job: these values
      # protect nothing.
      DATABASE_URL: postgres://sekoya:ci-only-password@localhost:5432/sekoya
      DATABASE_URL_UNPOOLED: postgres://sekoya:ci-only-password@localhost:5432/sekoya
      PAYLOAD_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Biome runs in CI mode: it reports problems and changes no file.
      - run: npx biome ci
      - run: npm run typecheck
      - run: npm run payload -- migrate
      - run: npm run generate -- --scale small --seed 1
      - run: npm run build

  # The generator at the small scale and Vitest, against a PostgreSQL 18
  # service container with the committed migrations (issue #46).
  catalog-tests:
    name: Generator and tests
    needs: changes
    # Skipped on a documentation-only pull request or push; runs if detection failed.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: sekoya
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sekoya
        ports:
          - 5432:5432
        # The job starts only once the server accepts connections.
        options: >-
          --health-cmd "pg_isready -U sekoya -d sekoya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A throwaway database that only exists for this job: these values
      # protect nothing.
      DATABASE_URL: postgres://sekoya:ci-only-password@localhost:5432/sekoya
      DATABASE_URL_UNPOOLED: postgres://sekoya:ci-only-password@localhost:5432/sekoya
      PAYLOAD_SECRET: ci-only-secret
      CATALOG_SCALE: small
      CATALOG_SEED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run payload -- migrate
      - run: npm run generate -- --scale "$CATALOG_SCALE" --seed "$CATALOG_SEED"
      - run: npm test

  # Playwright and the 2 MB test against this job's own production build, on
  # the small catalog in its own PostgreSQL 18 container (issue #60). Chromium
  # is installed on the runner only, from Playwright's download servers.
  end-to-end:
    name: End-to-end tests
    needs: changes
    # Skipped on a documentation-only pull request or push; runs if detection failed.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: sekoya
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sekoya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sekoya -d sekoya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # A throwaway database that only exists for this job: these values
      # protect nothing.
      DATABASE_URL: postgres://sekoya:ci-only-password@localhost:5432/sekoya
      DATABASE_URL_UNPOOLED: postgres://sekoya:ci-only-password@localhost:5432/sekoya
      PAYLOAD_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run payload -- migrate
      - run: npm run generate -- --scale small --seed 1
      - run: npm run build
      # The headless shell is all a headless run needs; --with-deps adds the
      # system libraries it uses.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      # Traces of failed tests only. The repository is public, so anyone can
      # download them: they hold this job's pages and throwaway values, no
      # secret.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
