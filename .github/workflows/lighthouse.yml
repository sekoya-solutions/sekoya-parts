# Lighthouse on each ready Vercel preview, decided in
# docs/adr/0004-testing-and-ci.md. Since issue #61, the job fails when an
# address's median mobile performance is below 95. Since issue #59, the
# scores also appear in a "Lighthouse scores" check and in one comment on the
# pull request, and the redacted reports are uploaded. Since issue #67, it also
# runs on each ready Production deployment of main, at the public address,
# without the bypass secret and without a comment.
# deployment_status runs this file as it is on the deployed commit; Vercel
# sends the event while the project's "deployment_status Events" Git setting
# is on.
name: Lighthouse

on:
  deployment_status:

permissions:
  contents: read
  # The "Lighthouse scores" check and the pull request comment (issue #59).
  checks: write
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.event.deployment.environment }}-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse
    if: >-
      github.event.deployment_status.state == 'success' &&
      (startsWith(github.event.deployment.environment, 'Preview') ||
      github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Single loads, one after another, on five pages: the French home page,
      # the first category it lists (issue #81), the heaviest product page, its
      # first reference page and its most popular model's page (issue #79).
      # For each: one request to check the deployment answers (on production,
      # that the public address serves this commit), one Lighthouse warm-up
      # run that is not counted, then five measured runs.
      # Fails below 95, after writing the figures and the reports. The bypass
      # secret goes to previews only. /fr/p/sp000001 redirects to the French
      # address of product SP000001, whose words depend on the catalog; the
      # script measures the target. first-link: measures the first link on
      # that page whose address starts with the prefix.
      - name: Measure the deployment
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ startsWith(github.event.deployment.environment, 'Preview') && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
          DEPLOY_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: >-
          node scripts/lighthouse.ts "$DEPLOY_ENVIRONMENT" "$DEPLOY_URL"
          /fr first-link:/fr:/fr/ /fr/p/sp000001 /fr/p/sp000001/1
          first-link:/fr/p/sp000001:/fr/appareil/
      # The script writes only reports it has redacted and checked for the
      # secret. The repository is public: any signed-in GitHub user can
      # download them.
      - name: Upload the reports
        id: reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports-${{ github.event.deployment.sha }}
          path: lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 30
      # Without the bypass secret: only the workflow's own token. It also runs
      # when the measure step failed the threshold, whenever the figures exist.
      - name: Publish the scores
        if: always() && hashFiles('lighthouse-figures.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORTS_URL: ${{ steps.reports.outputs.artifact-url }}
        run: node scripts/lighthouse-publish.ts
